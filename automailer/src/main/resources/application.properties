spring.application.name=doot
# Keep the desktop application local to this computer.
server.port=8080
server.address=127.0.0.1

# H2 Database configuration
spring.datasource.url=jdbc:h2:file:./data/doot;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console is a developer tool and is disabled in the packaged app.
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# Multipart File Upload limits
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
